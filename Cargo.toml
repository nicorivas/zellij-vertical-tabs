[package]
name = "zellij-vertical-tabs"
version = "0.1.0"
edition = "2024"
description = "A vertical tab bar plugin for zellij"
license = "MIT"

[workspace]
members = ["activity"]

[dependencies]
# Using git dependency for zellij-tile to get unbold_all() method
# which is only available in main branch (not yet released to crates.io)
# This allows us to render non-bold text for a cleaner tmux-like appearance
# Fijado a la versión del servidor de Nico: con `main` el protocolo de eventos se desalinea
# (un evento nuevo llega con otro número y el plugin muere al decodificarlo).
zellij-tile = { git = "https://github.com/zellij-org/zellij", tag = "v0.45.1" }
unicode-width = "0.2"
activity = { path = "activity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
